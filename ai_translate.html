<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 翻译</title>
<style>
  :root {
    --bg: #eef2f9;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: #eef2ff;
    --danger: #dc2626;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 10% -10%, #e0e7ff 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, #dbeafe 0%, transparent 55%),
      var(--bg);
    padding: 24px 16px 40px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1080px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  header h1 {
    margin: 0 0 6px;
    font-size: clamp(22px, 4vw, 30px);
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    align-items: stretch;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .panel-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    line-height: 1.55;
    font-family: inherit;
    color: var(--text);
    background: #fbfcff;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }

  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s, opacity 0.15s;
    touch-action: manipulation;
  }

  button:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    flex: 1;
    min-width: 120px;
  }

  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-ghost {
    background: #f3f4f6;
    color: #374151;
  }

  .btn-ghost:hover:not(:disabled) { background: #e5e7eb; }

  .lang-options {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .radio {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    background: #fbfcff;
    font-size: 15px;
    font-weight: 500;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    user-select: none;
  }

  .radio:has(input:checked) {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary-hover);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
  }

  .radio input {
    accent-color: var(--primary);
    width: 16px;
    height: 16px;
    margin: 0;
  }

  .result {
    flex: 1;
    min-height: 220px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-y: auto;
    background: #fbfcff;
    color: var(--text);
  }

  .result.placeholder { color: #9ca3af; }
  .result.error { color: var(--danger); border-color: #fecaca; background: #fef2f2; }
  .result.loading { color: var(--muted); }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: -2px;
  }

  @media (max-width: 760px) {
    body { padding: 16px 12px 32px; }
    .panels { grid-template-columns: 1fr; gap: 14px; }
    textarea, .result { min-height: 170px; }
    .panel { padding: 14px; border-radius: 14px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>AI 翻译</h1>
      <p>输入任意语言，选择目标语言后点击翻译</p>
    </header>

    <main class="panels">
      <!-- 左侧：输入 -->
      <section class="panel">
        <div class="panel-title">原文输入</div>
        <textarea
          id="inputText"
          placeholder="输入任何语言的内容，例如：Bonjour le monde"
          spellcheck="false"
        ></textarea>
        <div class="hint">支持任意语言；特殊符号会自动安全编码。</div>
        <div class="actions">
          <button id="translateBtn" class="btn-primary" type="button">翻译</button>
          <button id="clearBtn" class="btn-ghost" type="button">清空</button>
        </div>
      </section>

      <!-- 右侧：目标语言 + 译文 -->
      <section class="panel">
        <div class="panel-title">目标语言</div>
        <div class="lang-options" role="radiogroup" aria-label="目标语言">
          <label class="radio">
            <input type="radio" name="targetLang" value="zh" checked />
            简体中文
          </label>
          <label class="radio">
            <input type="radio" name="targetLang" value="en" />
            英语
          </label>
        </div>

        <div class="panel-title" style="margin-top: 4px;">译文</div>
        <div id="result" class="result placeholder">翻译结果将显示在这里</div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      // 两个翻译接口：按目标语言选择
      const API_ENDPOINTS = {
        zh: "https://translate-to-zh.44477444.xyz/",
        en: "https://translate-to-en.44477444.xyz/"
      };

      const inputEl = document.getElementById("inputText");
      const resultEl = document.getElementById("result");
      const translateBtn = document.getElementById("translateBtn");
      const clearBtn = document.getElementById("clearBtn");

      function setResult(text, state) {
        resultEl.textContent = text;
        resultEl.classList.remove("placeholder", "error", "loading");
        if (state) resultEl.classList.add(state);
      }

      function getSelectedLang() {
        const checked = document.querySelector('input[name="targetLang"]:checked');
        return checked ? checked.value : "zh";
      }

      /**
       * 从接口返回中尽量提取译文文本。
       * 不同服务返回结构可能不同，这里做兼容处理。
       */
      function extractTranslation(data) {
        if (data == null) return "";
        if (typeof data === "string") return data;
        if (typeof data === "object") {
          const candidates = [
            data.translated,
            data.translation,
            data.result,
            data.response,
            data.text,
            data.data && data.data.translated,
            data.data && data.data.translation,
            data.data && data.data.result
          ];
          for (const c of candidates) {
            if (typeof c === "string" && c.trim() !== "") return c;
          }
          // 实在找不到已知字段，就把整体序列化展示，便于排查
          return JSON.stringify(data, null, 2);
        }
        return String(data);
      }

      async function doTranslate() {
        const raw = inputEl.value.trim();

        if (!raw) {
          setResult("请先输入需要翻译的内容。", "error");
          inputEl.focus();
          return;
        }

        const lang = getSelectedLang();
        const endpoint = API_ENDPOINTS[lang];

        if (!endpoint) {
          setResult("未找到对应的翻译接口。", "error");
          return;
        }

        // 关键：对 text 值做 URL 编码，避免 & = # + 空格等符号打断 URL
        const url = endpoint + "?text=" + encodeURIComponent(raw);

        translateBtn.disabled = true;
        translateBtn.textContent = "翻译中…";
        setResult("正在翻译，请稍候…", "loading");

        try {
          const res = await fetch(url, {
            method: "GET",
            headers: { Accept: "application/json" }
          });

          if (!res.ok) {
            throw new Error("接口返回状态码 " + res.status);
          }

          const contentType = res.headers.get("content-type") || "";
          let translated = "";

          if (contentType.includes("application/json")) {
            const data = await res.json();
            translated = extractTranslation(data);
          } else {
            translated = (await res.text()).trim();
          }

          if (!translated) {
            setResult("接口未返回有效译文。", "error");
          } else {
            setResult(translated, null);
          }
        } catch (err) {
          setResult("翻译失败：" + (err && err.message ? err.message : String(err)), "error");
        } finally {
          translateBtn.disabled = false;
          translateBtn.textContent = "翻译";
        }
      }

      translateBtn.addEventListener("click", doTranslate);

      clearBtn.addEventListener("click", function () {
        inputEl.value = "";
        setResult("翻译结果将显示在这里", "placeholder");
        inputEl.focus();
      });

      // Ctrl/Cmd + Enter 快捷翻译
      inputEl.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          doTranslate();
        }
      });
    })();
  </script>
</body>
</html>
